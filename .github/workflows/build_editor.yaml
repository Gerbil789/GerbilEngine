name: Build Editor

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        configuration: [EditorDebug, EditorRelease]
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Generate Visual Studio project files
        run: scripts/premake/premake5.exe vs2022

      - name: Build project
        run: |
          msbuild /p:Configuration=${{ matrix.configuration }} /p:Platform=Windows GerbilEngine.sln

  build-linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        configuration: [editordebug, editorrelease]
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang libc++-dev libc++abi-dev libx11-dev libxcursor-dev libxi-dev libxinerama-dev libxrandr-dev libwayland-dev libxkbcommon-dev
      
      - name: Make Premake executable
        run: chmod +x scripts/premake/premake5

      - name: Generate Makefiles
        run: ./scripts/premake/premake5 gmake

      - name: Build project
        run: make config=${{ matrix.configuration }}_linux -j$(nproc)